name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned to a commit SHA (tags are mutable). Bump deliberately.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Package and release
        # Receives CF_API_KEY + write token; pinned to a reviewed SHA.
        uses: BigWigsMods/packager@ac645e59158d7ad4ea4991bd62919ff50057d04f # v2.7.0
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
